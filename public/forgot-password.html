<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Your Password 💖 - donotbesolo 💖</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="js/connection.js"></script>
  <style>
    .forgot-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .forgot-card {
      width: 100%;
      max-width: 450px;
      position: relative;
    }
    .forgot-title {
      font-size: 32px;
      color: var(--accent-pink);
      text-shadow: var(--pink-glow-shadow);
      margin-bottom: 8px;
      text-align: center;
    }
    .forgot-subtitle {
      font-size: 15px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 30px;
      line-height: 1.5;
    }
    .otp-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .otp-row .cyber-input {
      flex: 1;
    }
    .btn-otp {
      width: auto;
      padding: 14px 20px;
      font-size: 14px;
      flex-shrink: 0;
      margin-bottom: 0px;
      white-space: nowrap;
      border-radius: 12px;
    }
    .timer-text {
      font-size: 12px;
      color: var(--rose-gold);
      margin-top: 5px;
      display: none;
      text-shadow: 0 0 4px rgba(255, 77, 166, 0.3);
    }
    .error-msg {
      color: #ff4a4a;
      background: rgba(255, 74, 74, 0.1);
      border: 1px solid rgba(255, 74, 74, 0.3);
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
    .success-msg {
      color: var(--rose-gold);
      background: rgba(255, 77, 166, 0.15);
      border: 1px solid rgba(255, 77, 166, 0.3);
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
    .bubble-1 { top: 10%; right: 10%; }
    .bubble-2 { bottom: 10%; left: 10%; }
  </style>
  <script>
    let timerInterval = null;

    document.addEventListener("DOMContentLoaded", () => {
      // Create heart particles background
      const particleContainer = document.getElementById('heartParticles');
      const hearts = ['💖', '❤️', '💕', '✨', '🌸'];
      for (let i = 0; i < 15; i++) {
        const span = document.createElement('span');
        span.className = 'heart-particle';
        span.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        span.style.left = Math.random() * 100 + 'vw';
        span.style.animationDelay = Math.random() * 6 + 's';
        span.style.fontSize = (Math.random() * 12 + 12) + 'px';
        particleContainer.appendChild(span);
      }
    });

    function clearAlerts() {
      const errBox = document.getElementById('errorBox');
      const succBox = document.getElementById('successBox');
      errBox.style.display = 'none';
      succBox.style.display = 'none';
    }

    function showAlert(type, msg) {
      clearAlerts();
      const box = type === 'error' ? document.getElementById('errorBox') : document.getElementById('successBox');
      box.textContent = msg;
      box.style.display = 'block';
    }

    function requestResetOtp() {
      const inputEl = document.getElementById('recoverInput');
      const usernameOrEmail = inputEl.value.trim();

      if (!usernameOrEmail) {
        return showAlert('error', 'Please enter your username or registered email address.');
      }

      const otpBtn = document.getElementById('otpBtn');
      otpBtn.disabled = true;
      otpBtn.style.opacity = 0.5;

      fetch('/api/send-reset-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usernameOrEmail })
      })
      .then(res => res.json())
      .then(data => {
        if (data.error) {
          showAlert('error', data.error);
          otpBtn.disabled = false;
          otpBtn.style.opacity = 1;
        } else {
          let alertMsg = data.message;
          if (data.devMode) {
            alertMsg += " (OTP outputted in server terminal console)";
          }
          showAlert('success', alertMsg);

          // Lock initial credential inputs
          inputEl.disabled = true;
          inputEl.style.opacity = 0.7;

          // Reveal fields
          document.getElementById('otpGroup').style.display = 'block';
          document.getElementById('recoverOtp').required = true;
          
          document.getElementById('passGroup').style.display = 'block';
          document.getElementById('recoverPass').required = true;

          // Enable submit button
          const submitBtn = document.getElementById('resetSubmitBtn');
          submitBtn.disabled = false;
          submitBtn.style.opacity = 1;
          submitBtn.style.cursor = 'pointer';

          // Trigger countdown
          startOtpTimer();
        }
      })
      .catch(err => {
        showAlert('error', 'Connection to server failed.');
        otpBtn.disabled = false;
        otpBtn.style.opacity = 1;
      });
    }

    function startOtpTimer() {
      const timerText = document.getElementById('timerText');
      const otpBtn = document.getElementById('otpBtn');
      timerText.style.display = 'block';
      let remaining = 60;

      timerText.textContent = `Re-request available in: ${remaining}s`;

      if (timerInterval) clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(timerInterval);
          timerText.style.display = 'none';
          otpBtn.disabled = false;
          otpBtn.style.opacity = 1;
          otpBtn.textContent = 'Send OTP';
        } else {
          timerText.textContent = `Re-request available in: ${remaining}s`;
        }
      }, 1000);
    }

    function handleResetPassword(event) {
      event.preventDefault();
      clearAlerts();

      const usernameOrEmail = document.getElementById('recoverInput').value.trim();
      const otpCode = document.getElementById('recoverOtp').value.trim();
      const newPassword = document.getElementById('recoverPass').value.trim();

      fetch('/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usernameOrEmail, otpCode, newPassword })
      })
      .then(res => res.json())
      .then(data => {
        if (data.error) {
          showAlert('error', data.error);
        } else {
          showAlert('success', 'Password updated successfully! Redirecting to login...');
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 2000);
        }
      })
      .catch(err => {
        showAlert('error', 'Failed to submit recovery details.');
      });
    }
  </script>
</head>
<body>
  <div class="glow-bubble bubble-1"></div>
  <div class="glow-bubble glow-bubble-pink bubble-2"></div>
  <div class="heart-particles" id="heartParticles"></div>

  <div class="forgot-container">
    <div class="glass-panel forgot-card">
      <h2 class="forgot-title">Recover Password ❤️</h2>
      <p class="forgot-subtitle">Get back to your romantic connection using email authentication</p>

      <!-- ALERT MESSAGE LOGS -->
      <div id="errorBox" class="error-msg"></div>
      <div id="successBox" class="success-msg"></div>

      <form onsubmit="handleResetPassword(event)">
        <!-- IDENTIFIER -->
        <div class="input-group">
          <label for="recoverInput">Username or Email Address</label>
          <div class="otp-row">
            <input type="text" id="recoverInput" class="cyber-input" placeholder="you@example.com" required>
            <button type="button" id="otpBtn" onclick="requestResetOtp()" class="btn-cyber btn-cyber-cyan btn-otp">Send OTP</button>
          </div>
          <div id="timerText" class="timer-text">Re-request available in: 60s</div>
        </div>

        <!-- OTP CODE -->
        <div class="input-group" id="otpGroup" style="display: none;">
          <label for="recoverOtp">Recovery OTP Code (6-Digits)</label>
          <input type="text" id="recoverOtp" class="cyber-input" placeholder="000000" maxlength="6" pattern="\d{6}">
        </div>

        <!-- NEW PASSWORD -->
        <div class="input-group" id="passGroup" style="display: none;">
          <label for="recoverPass">New Password</label>
          <input type="password" id="recoverPass" class="cyber-input" placeholder="••••••••">
        </div>

        <!-- ACTIONS -->
        <button type="submit" id="resetSubmitBtn" class="btn-cyber" style="opacity: 0.6; cursor: not-allowed;" disabled>Reset Password ❤️</button>
      </form>

      <div style="text-align: center; margin-top: 20px; font-size: 14px;">
        <a href="/login.html">Cancel & Go to Login 💖</a>
      </div>
    </div>
  </div>
</body>
</html>
