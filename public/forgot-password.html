<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Your Password 💖 - donotbesolo 💖</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="js/connection.js"></script>
  <style>
    .forgot-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .forgot-card {
      width: 100%;
      max-width: 450px;
      position: relative;
    }
    .forgot-title {
      font-size: 32px;
      color: var(--accent-pink);
      text-shadow: var(--pink-glow-shadow);
      margin-bottom: 8px;
      text-align: center;
    }
    .forgot-subtitle {
      font-size: 15px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 30px;
      line-height: 1.5;
    }
    .otp-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .otp-row .cyber-input {
      flex: 1;
    }
    .btn-otp {
      width: auto;
      padding: 14px 20px;
      font-size: 14px;
      flex-shrink: 0;
      margin-bottom: 0px;
      white-space: nowrap;
      border-radius: 12px;
    }
    .timer-text {
      font-size: 12px;
      color: var(--rose-gold);
      margin-top: 5px;
      display: none;
      text-shadow: 0 0 4px rgba(255, 77, 166, 0.3);
    }
    .error-msg {
      color: #ff4a4a;
      background: rgba(255, 74, 74, 0.1);
      border: 1px solid rgba(255, 74, 74, 0.3);
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
    .success-msg {
      color: var(--rose-gold);
      background: rgba(255, 77, 166, 0.15);
      border: 1px solid rgba(255, 77, 166, 0.3);
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
    .bubble-1 { top: 10%; right: 10%; }
    .bubble-2 { bottom: 10%; left: 10%; }
  </style>
  <script>
    let resetToken = null;

    document.addEventListener("DOMContentLoaded", () => {
      // Create heart particles background
      const particleContainer = document.getElementById('heartParticles');
      const hearts = ['💖', '❤️', '💕', '✨', '🌸'];
      for (let i = 0; i !== 15; i++) {
        const span = document.createElement('span');
        span.className = 'heart-particle';
        span.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        span.style.left = Math.random() * 100 + 'vw';
        span.style.animationDelay = Math.random() * 6 + 's';
        span.style.fontSize = (Math.random() * 12 + 12) + 'px';
        particleContainer.appendChild(span);
      }

      // Check URL parameters for token
      const urlParams = new URLSearchParams(window.location.search);
      resetToken = urlParams.get('token');

      const titleEl = document.querySelector('.forgot-title');
      const subtitleEl = document.querySelector('.forgot-subtitle');

      if (resetToken) {
        // We have a reset token: show reset password form
        titleEl.textContent = 'Set New Password ❤️';
        subtitleEl.textContent = 'Enter your new secure cybernetic password credentials';

        document.getElementById('recoverInputGroup').style.display = 'none';
        document.getElementById('passGroup').style.display = 'block';
        document.getElementById('recoverPass').required = true;
        document.getElementById('confirmPassGroup').style.display = 'block';
        document.getElementById('confirmPass').required = true;

        const submitBtn = document.getElementById('resetSubmitBtn');
        submitBtn.disabled = false;
        submitBtn.style.opacity = 1;
        submitBtn.style.cursor = 'pointer';
        submitBtn.textContent = 'Update Password ❤️';
      } else {
        // Request reset link form
        titleEl.textContent = 'Recover Password ❤️';
        subtitleEl.textContent = 'Get back to your romantic connection using email authentication';

        document.getElementById('recoverInputGroup').style.display = 'block';
        document.getElementById('passGroup').style.display = 'none';
        document.getElementById('confirmPassGroup').style.display = 'none';

        const submitBtn = document.getElementById('resetSubmitBtn');
        submitBtn.style.display = 'none';
      }
    });

    function clearAlerts() {
      const errBox = document.getElementById('errorBox');
      const succBox = document.getElementById('successBox');
      errBox.style.display = 'none';
      succBox.style.display = 'none';
    }

    function showAlert(type, msg) {
      clearAlerts();
      const box = type === 'error' ? document.getElementById('errorBox') : document.getElementById('successBox');
      box.textContent = msg;
      box.style.display = 'block';
    }

    function requestResetLink() {
      const inputEl = document.getElementById('recoverInput');
      const email = inputEl.value.trim();

      if (!email) {
        return showAlert('error', 'Please enter your registered email address.');
      }

      // Check email format
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        return showAlert('error', 'Please enter a valid email address.');
      }

      const otpBtn = document.getElementById('otpBtn');
      otpBtn.disabled = true;
      otpBtn.style.opacity = 0.5;
      otpBtn.textContent = 'Sending...';

      fetch('/api/send-reset-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      })
      .then(res => res.json())
      .then(data => {
        if (data.error) {
          showAlert('error', data.error);
          otpBtn.disabled = false;
          otpBtn.style.opacity = 1;
          otpBtn.textContent = 'Send Link';
        } else {
          let alertMsg = data.message;
          if (data.devMode) {
            alertMsg += " (Recovery link outputted in server terminal console)";
          }
          showAlert('success', alertMsg);
          inputEl.disabled = true;
          inputEl.style.opacity = 0.7;
          otpBtn.style.display = 'none';
        }
      })
      .catch(err => {
        showAlert('error', 'Connection to server failed.');
        otpBtn.disabled = false;
        otpBtn.style.opacity = 1;
        otpBtn.textContent = 'Send Link';
      });
    }

    function handleResetPassword(event) {
      event.preventDefault();
      clearAlerts();

      if (!resetToken) return;

      const newPassword = document.getElementById('recoverPass').value;
      const confirmPassword = document.getElementById('confirmPass').value;
      const submitBtn = document.getElementById('resetSubmitBtn');

      if (newPassword.length < 6) {
        showAlert('error', 'Password must be at least 6 characters long.');
        return;
      }

      if (newPassword !== confirmPassword) {
        showAlert('error', 'Passwords do not match.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating...';

      fetch('/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: resetToken, newPassword })
      })
      .then(res => res.json())
      .then(data => {
        if (data.error) {
          showAlert('error', data.error);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Update Password ❤️';
        } else {
          showAlert('success', 'Password updated successfully! Redirecting to login...');
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 2000);
        }
      })
      .catch(err => {
        console.error(err);
        showAlert('error', 'Failed to submit recovery details.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password ❤️';
      });
    }
  </script>
</head>
<body>
  <div class="glow-bubble bubble-1"></div>
  <div class="glow-bubble glow-bubble-pink bubble-2"></div>
  <div class="heart-particles" id="heartParticles"></div>

  <div class="forgot-container">
    <div class="glass-panel forgot-card">
      <h2 class="forgot-title">Recover Password ❤️</h2>
      <p class="forgot-subtitle">Get back to your romantic connection using email authentication</p>

      <!-- ALERT MESSAGE LOGS -->
      <div id="errorBox" class="error-msg"></div>
      <div id="successBox" class="success-msg"></div>

      <form onsubmit="handleResetPassword(event)">
        <!-- IDENTIFIER -->
        <div class="input-group" id="recoverInputGroup">
          <label for="recoverInput">Registered Email Address</label>
          <div class="otp-row">
            <input type="email" id="recoverInput" class="cyber-input" placeholder="you@example.com" required>
            <button type="button" id="otpBtn" onclick="requestResetLink()" class="btn-cyber btn-cyber-cyan btn-otp">Send Link</button>
          </div>
          <div style="font-size: 12px; color: var(--text-dim); margin-top: 10px; line-height: 1.4;">
            ⚠️ <strong>Note:</strong> Password recovery requires a registered email address. If you did not link an email to your account, please contact administrative support for manual recovery.
          </div>
        </div>

        <!-- NEW PASSWORD -->
        <div class="input-group" id="passGroup" style="display: none;">
          <label for="recoverPass">New Password</label>
          <input type="password" id="recoverPass" class="cyber-input" placeholder="••••••••">
        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="input-group" id="confirmPassGroup" style="display: none;">
          <label for="confirmPass">Confirm Password</label>
          <input type="password" id="confirmPass" class="cyber-input" placeholder="••••••••">
        </div>

        <!-- ACTIONS -->
        <button type="submit" id="resetSubmitBtn" class="btn-cyber" style="opacity: 0.6; cursor: not-allowed;" disabled>Reset Password ❤️</button>
      </form>

      <div style="text-align: center; margin-top: 20px; font-size: 14px;">
        <a href="/login.html">Cancel & Go to Login 💖</a>
      </div>
    </div>
  </div>
</body>
</html>
