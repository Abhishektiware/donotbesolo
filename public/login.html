<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Sign Up 💖 - donotbesolo 💖</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="js/connection.js"></script>

  <style>
    .auth-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      gap: 24px;
    }

    .auth-card {
      width: 100%;
      max-width: 450px;
      position: relative;
    }

    .auth-tabs {
      display: flex;
      margin-bottom: 30px;
      border-bottom: 2px solid rgba(255, 42, 117, 0.2);
    }

    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-family: var(--font-body);
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-dim);
      border-bottom: 2px solid transparent;
      transition: all 0.3s ease;
    }

    .tab.active {
      color: var(--accent-pink);
      border-color: var(--accent-pink);
      text-shadow: var(--pink-glow-shadow);
    }

    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    .forgot-link {
      display: block;
      text-align: right;
      font-size: 13px;
      margin-top: -10px;
      margin-bottom: 20px;
    }

    .error-msg {
      color: #ff4a4a;
      background: rgba(255, 74, 74, 0.1);
      border: 1px solid rgba(255, 74, 74, 0.3);
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }

    .success-msg {
      color: var(--rose-gold);
      background: rgba(255, 77, 166, 0.15);
      border: 1px solid rgba(255, 77, 166, 0.3);
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }

    .bubble-1 {
      top: 10%;
      right: 15%;
    }

    .bubble-2 {
      bottom: 10%;
      left: 15%;
    }
  </style>
</head>

<body>
  <div class="glow-bubble glow-bubble-pink bubble-1"></div>
  <div class="glow-bubble bubble-2"></div>
  <div class="heart-particles" id="heartParticles"></div>

  <div class="auth-container">
    <div class="glass-panel auth-card">
      <div class="auth-tabs">
        <div class="tab active" onclick="switchTab('login')">Sign In</div>
        <div class="tab" onclick="switchTab('signup')">Create Account</div>
      </div>

      <!-- STATUS NOTIFICATIONS -->
      <div id="errorBox" class="error-msg"></div>
      <div id="successBox" class="success-msg"></div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="auth-form active" onsubmit="handleLoginSubmit(event)">
        <div class="input-group">
          <label for="loginUsernameOrEmail">Username or Email</label>
          <input type="text" id="loginUsernameOrEmail" class="cyber-input" placeholder="Enter username or email" required>
        </div>
        <div class="input-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="cyber-input" placeholder="••••••••" required>
        </div>
        <a href="/forgot-password.html" class="forgot-link">Forgot Password?</a>
        <button type="submit" id="loginSubmitBtn" class="btn-cyber" style="margin-top: 20px;">Sign In ❤️</button>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signupForm" class="auth-form" onsubmit="handleSignupSubmit(event)">
        <div class="input-group">
          <label for="signupName">Full Name</label>
          <input type="text" id="signupName" class="cyber-input" placeholder="Your Name" required>
        </div>
        <div class="input-group">
          <label for="signupUsername">Username</label>
          <input type="text" id="signupUsername" class="cyber-input" placeholder="Choose a username..." required>
        </div>
        <div class="input-group">
          <label for="signupEmail">Email (Optional)</label>
          <input type="email" id="signupEmail" class="cyber-input" placeholder="you@example.com (optional)">
        </div>
        <div class="input-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" class="cyber-input" placeholder="••••••••" required>
        </div>
        <div class="input-group">
          <label for="signupConfirmPassword">Confirm Password</label>
          <input type="password" id="signupConfirmPassword" class="cyber-input" placeholder="••••••••" required>
        </div>
        <button type="submit" id="signupSubmitBtn" class="btn-cyber" style="margin-top: 20px;">Create Account ❤️</button>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const tab = urlParams.get('tab');
      if (tab === 'signup') {
        switchTab('signup');
      }

      const message = urlParams.get('message');
      if (message === 'auth') {
        showAlert('error', 'Please log in or sign up first to start chatting! ❤️');
      } else if (message === 'email_verified') {
        showAlert('success', 'Your email has been successfully verified! You can now log in. 💖');
      } else if (message === 'email_verification_failed') {
        showAlert('error', 'The email verification link is invalid or has expired. ❌');
      }

      // Heart floating animation
      const particleContainer = document.getElementById('heartParticles');
      const hearts = ['💖', '❤️', '💕', '✨', '🌸'];
      for (let i = 0; i !== 15; i++) {
        const span = document.createElement('span');
        span.className = 'heart-particle';
        span.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        span.style.left = Math.random() * 100 + 'vw';
        span.style.animationDelay = Math.random() * 6 + 's';
        span.style.fontSize = (Math.random() * 12 + 12) + 'px';
        particleContainer.appendChild(span);
      }
    });

    function switchTab(type) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      clearAlerts();

      if (type === 'login') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('loginForm').classList.add('active');
      } else {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('signupForm').classList.add('active');
      }
    }

    function clearAlerts() {
      document.getElementById('errorBox').style.display = 'none';
      document.getElementById('successBox').style.display = 'none';
    }

    function showAlert(type, msg) {
      clearAlerts();
      const box = type === 'error' ? document.getElementById('errorBox') : document.getElementById('successBox');
      box.textContent = msg;
      box.style.display = 'block';
    }

    window.handleLoginSubmit = function (event) {
      event.preventDefault();
      clearAlerts();

      const usernameOrEmail = document.getElementById('loginUsernameOrEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const submitBtn = document.getElementById('loginSubmitBtn');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usernameOrEmail, password })
      })
      .then(res => res.json())
      .then(data => {
        if (data.error) {
          showAlert('error', data.error);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In ❤️';
        } else {
          localStorage.setItem('token', data.token);
          localStorage.setItem('userId', data.userId);
          localStorage.setItem('username', data.username);
          if (data.credits !== undefined) localStorage.setItem('credits', data.credits);
          if (data.coins !== undefined) localStorage.setItem('coins', data.coins);
          localStorage.setItem('isSubscriptionActive', data.isSubscriptionActive);
          if (data.paymentStatus) localStorage.setItem('paymentStatus', data.paymentStatus);

          showAlert('success', 'Authenticated successfully! Redirecting...');
          setTimeout(() => {
            window.location.href = data.redirect || '/';
          }, 1200);
        }
      })
      .catch(err => {
        console.error(err);
        showAlert('error', 'Login connection failed.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In ❤️';
      });
    };

    window.handleSignupSubmit = function (event) {
      event.preventDefault();
      clearAlerts();

      const fullname = document.getElementById('signupName').value.trim();
      const username = document.getElementById('signupUsername').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;
      const confirmPassword = document.getElementById('signupConfirmPassword').value;
      const submitBtn = document.getElementById('signupSubmitBtn');

      if (password !== confirmPassword) {
        showAlert('error', 'Passwords do not match.');
        submitBtn.disabled = false;
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          fullname,
          username,
          email,
          password,
          confirmPassword,
          referralCode: localStorage.getItem('refCode') || null
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.error) {
          showAlert('error', data.error);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account ❤️';
        } else {
          localStorage.setItem('token', data.token);
          localStorage.setItem('userId', data.userId);
          localStorage.setItem('username', data.username);
          if (data.credits !== undefined) localStorage.setItem('credits', data.credits);
          if (data.coins !== undefined) localStorage.setItem('coins', data.coins);
          localStorage.setItem('isSubscriptionActive', 'false');
          if (data.paymentStatus) localStorage.setItem('paymentStatus', data.paymentStatus);

          const successMsg = data.message || 'Account created successfully! Redirecting... 💖';
          showAlert('success', successMsg);
          setTimeout(() => {
            window.location.href = data.redirect || '/';
          }, 2000);
        }
      })
      .catch(err => {
        console.error(err);
        showAlert('error', 'Signup connection failed.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account ❤️';
      });
    };
  </script>
</body>

</html>
