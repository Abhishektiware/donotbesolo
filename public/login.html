<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Sign Up 💖 - donotbesolo 💖</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="js/connection.js"></script>
  <style>
    .auth-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      gap: 24px;
    }

    .auth-card {
      width: 100%;
      max-width: 450px;
      position: relative;
    }

    .auth-tabs {
      display: flex;
      margin-bottom: 30px;
      border-bottom: 2px solid rgba(255, 42, 117, 0.2);
    }

    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-family: var(--font-body);
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-dim);
      border-bottom: 2px solid transparent;
      transition: all 0.3s ease;
    }

    .tab.active {
      color: var(--accent-pink);
      border-color: var(--accent-pink);
      text-shadow: var(--pink-glow-shadow);
    }

    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    .forgot-link {
      display: block;
      text-align: right;
      font-size: 13px;
      margin-top: -10px;
      margin-bottom: 20px;
    }

    .error-msg {
      color: #ff4a4a;
      background: rgba(255, 74, 74, 0.1);
      border: 1px solid rgba(255, 74, 74, 0.3);
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }

    .success-msg {
      color: var(--rose-gold);
      background: rgba(255, 77, 166, 0.15);
      border: 1px solid rgba(255, 77, 166, 0.3);
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }

    .bubble-1 {
      top: 10%;
      right: 15%;
    }

    .bubble-2 {
      bottom: 10%;
      left: 15%;
    }
  </style>
</head>

<body>
  <div class="glow-bubble glow-bubble-pink bubble-1"></div>
  <div class="glow-bubble bubble-2"></div>
  <div class="heart-particles" id="heartParticles"></div>

  <div class="auth-container">
    <div class="glass-panel auth-card">
      <div class="auth-tabs">
        <div class="tab active" onclick="switchTab('login')">Sign In</div>
        <div class="tab" onclick="switchTab('signup')">Create Account</div>
      </div>

      <!-- STATUS LOGS -->
      <div id="errorBox" class="error-msg"></div>
      <div id="successBox" class="success-msg"></div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
        <div class="input-group">
          <label>Phone Number</label>
          <div class="phone-input-container">
            <span class="country-code-badge">+91</span>
            <input type="tel" id="loginPhone" class="phone-input-field" maxlength="10" placeholder="9876543210"
              required>
            <button type="button" id="loginGetOtpBtn" class="inline-otp-btn" onclick="sendOtp('login')">Get OTP</button>
          </div>
        </div>

        <!-- Inline OTP Field -->
        <div class="input-group" id="loginOtpGroup" style="display: none; margin-top: 15px;">
          <label for="loginOtp">Verification Code (OTP)</label>
          <input type="text" id="loginOtp" class="cyber-input" placeholder="Enter 6-digit OTP" maxlength="6"
            pattern="\d{6}">
          <div
            style="font-size: 12px; color: var(--text-dim); margin-top: 8px; display: flex; justify-content: space-between;">
            <span>Code expires in: <strong id="loginOtpTimerVal" style="color: #ff4a4a;">05:00</strong></span>
            <button type="button" id="loginResendBtn"
              style="background: none; border: none; cursor: pointer; color: var(--accent-pink); padding: 0; outline: none; font-family: var(--font-body); font-weight: 600;"
              onclick="sendOtp('login')">Resend Code</button>
          </div>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn-cyber" style="margin-top: 20px;">Verify & Continue
          ❤️</button>
      </form>

      <!-- REGISTRATION FORM -->
      <form id="signupForm" class="auth-form" onsubmit="handleSignup(event)">
        <div class="input-group">
          <label for="signupName">Full Name</label>
          <input type="text" id="signupName" class="cyber-input" placeholder="Your Name" required>
        </div>
        <div class="input-group">
          <label for="signupUsername">Username</label>
          <input type="text" id="signupUsername" class="cyber-input" placeholder="Choose a username..." required>
        </div>
        <div class="input-group">
          <label>Phone Number</label>
          <div class="phone-input-container">
            <span class="country-code-badge">+91</span>
            <input type="tel" id="signupPhone" class="phone-input-field" maxlength="10" placeholder="9876543210"
              required>
            <button type="button" id="signupGetOtpBtn" class="inline-otp-btn" onclick="sendOtp('signup')">Get
              OTP</button>
          </div>
        </div>

        <!-- Inline OTP Field -->
        <div class="input-group" id="signupOtpGroup" style="display: none; margin-top: 15px;">
          <label for="signupOtp">Verification Code (OTP)</label>
          <input type="text" id="signupOtp" class="cyber-input" placeholder="Enter 6-digit OTP" maxlength="6"
            pattern="\d{6}">
          <div
            style="font-size: 12px; color: var(--text-dim); margin-top: 8px; display: flex; justify-content: space-between;">
            <span>Code expires in: <strong id="signupOtpTimerVal" style="color: #ff4a4a;">05:00</strong></span>
            <button type="button" id="signupResendBtn"
              style="background: none; border: none; cursor: pointer; color: var(--accent-pink); padding: 0; outline: none; font-family: var(--font-body); font-weight: 600;"
              onclick="sendOtp('signup')">Resend Code</button>
          </div>
        </div>

        <!-- Referral / Promo Code (Optional) -->


        <script>
          document.addEventListener("DOMContentLoaded", () => {
            // Toggle tab based on query param
            const urlParams = new URLSearchParams(window.location.search);
            const tab = urlParams.get('tab');
            if (tab === 'signup') {
              switchTab('signup');
            }

            // Check auth restriction message
            const message = urlParams.get('message');
            if (message === 'auth') {
              showAlert('error', 'Please log in or sign up first to start chatting! ❤️');
            }

            // Create heart particles background
            const particleContainer = document.getElementById('heartParticles');
            const hearts = ['💖', '❤️', '💕', '✨', '🌸'];
            for (let i = 0; i < 15; i++) {
              const span = document.createElement('span');
              span.className = 'heart-particle';
              span.textContent = hearts[Math.floor(Math.random() * hearts.length)];
              span.style.left = Math.random() * 100 + 'vw';
              span.style.animationDelay = Math.random() * 6 + 's';
              span.style.fontSize = (Math.random() * 12 + 12) + 'px';
              particleContainer.appendChild(span);
            }
          });

          function switchTab(type) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            clearAlerts();

            if (type === 'login') {
              document.querySelectorAll('.tab')[0].classList.add('active');
              document.getElementById('loginForm').classList.add('active');
            } else {
              document.querySelectorAll('.tab')[1].classList.add('active');
              document.getElementById('signupForm').classList.add('active');
            }
          }

          function clearAlerts() {
            const errBox = document.getElementById('errorBox');
            const succBox = document.getElementById('successBox');
            errBox.style.display = 'none';
            succBox.style.display = 'none';
          }

          function showAlert(type, msg) {
            clearAlerts();
            const box = type === 'error' ? document.getElementById('errorBox') : document.getElementById('successBox');
            box.textContent = msg;
            box.style.display = 'block';
          }

          let expiryTimers = {};
          let cooldownTimers = {};

          // Get OTP flow
          window.sendOtp = function (formType) {
            clearAlerts();

            const phoneInput = document.getElementById(formType === 'login' ? 'loginPhone' : 'signupPhone');
            const getOtpBtn = document.getElementById(formType === 'login' ? 'loginGetOtpBtn' : 'signupGetOtpBtn');
            const otpGroup = document.getElementById(formType === 'login' ? 'loginOtpGroup' : 'signupOtpGroup');
            const otpInput = document.getElementById(formType === 'login' ? 'loginOtp' : 'signupOtp');

            const phoneVal = phoneInput.value.trim();
            let digits = phoneVal.replace(/\D/g, '');
            if (digits.length === 10) {
              digits = '91' + digits;
            }
            const fullPhone = '+' + digits;
            if (!/^\+91\d{10}$/.test(fullPhone)) {
              showAlert('error', 'Please enter a valid 10-digit mobile number.');
              return;
            }

            getOtpBtn.disabled = true;
            getOtpBtn.textContent = 'Sending...';

            fetch('/api/auth/send-phone-otp', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ phone: fullPhone })
            })
              .then(res => res.json())
              .then(data => {
                if (data.error) {
                  showAlert('error', data.error);
                  getOtpBtn.disabled = false;
                  getOtpBtn.textContent = 'Get OTP';
                } else {
                  showAlert('success', 'Verification OTP sent successfully!');
                  otpGroup.style.display = 'block';
                  otpInput.required = true;
                  otpInput.focus();

                  startExpiryTimer(formType, 300);
                  startCooldownTimer(formType, 60);
                }
              })
              .catch(err => {
                console.error(err);
                showAlert('error', 'Failed to request OTP. Please try again.');
                getOtpBtn.disabled = false;
                getOtpBtn.textContent = 'Get OTP';
              });
          }

          function startExpiryTimer(formType, durationSeconds) {
            if (expiryTimers[formType]) clearInterval(expiryTimers[formType]);

            const timerVal = document.getElementById(formType === 'login' ? 'loginOtpTimerVal' : 'signupOtpTimerVal');
            let secondsLeft = durationSeconds;

            function updateDisplay() {
              const minutes = Math.floor(secondsLeft / 60);
              const seconds = secondsLeft % 60;
              timerVal.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }

            updateDisplay();

            expiryTimers[formType] = setInterval(() => {
              secondsLeft--;
              if (secondsLeft <= 0) {
                clearInterval(expiryTimers[formType]);
                timerVal.textContent = "00:00";
                showAlert('error', 'Verification code has expired. Please click Resend Code.');
              } else {
                updateDisplay();
              }
            }, 1000);
          }

          function startCooldownTimer(formType, durationSeconds) {
            if (cooldownTimers[formType]) clearInterval(cooldownTimers[formType]);

            const getOtpBtn = document.getElementById(formType === 'login' ? 'loginGetOtpBtn' : 'signupGetOtpBtn');
            const resendBtn = document.getElementById(formType === 'login' ? 'loginResendBtn' : 'signupResendBtn');

            getOtpBtn.disabled = true;
            getOtpBtn.style.opacity = '0.5';
            getOtpBtn.style.cursor = 'not-allowed';

            resendBtn.disabled = true;
            resendBtn.style.opacity = '0.5';
            resendBtn.style.cursor = 'not-allowed';

            let secondsLeft = durationSeconds;
            getOtpBtn.textContent = `${secondsLeft}s`;
            resendBtn.textContent = `Resend Code (${secondsLeft}s)`;

            cooldownTimers[formType] = setInterval(() => {
              secondsLeft--;
              if (secondsLeft <= 0) {
                clearInterval(cooldownTimers[formType]);

                getOtpBtn.disabled = false;
                getOtpBtn.style.opacity = '1';
                getOtpBtn.style.cursor = 'pointer';
                getOtpBtn.textContent = 'Get OTP';

                resendBtn.disabled = false;
                resendBtn.style.opacity = '1';
                resendBtn.style.cursor = 'pointer';
                resendBtn.textContent = 'Resend Code';
              } else {
                getOtpBtn.textContent = `${secondsLeft}s`;
                resendBtn.textContent = `Resend Code (${secondsLeft}s)`;
              }
            }, 1000);
          }

          // Login submit
          window.handleLogin = function (event) {
            event.preventDefault();
            clearAlerts();

            const phoneVal = document.getElementById('loginPhone').value.trim();
            const otpVal = document.getElementById('loginOtp').value.trim();
            const otpGroup = document.getElementById('loginOtpGroup');

            if (otpGroup.style.display === 'none' || !otpVal) {
              showAlert('error', 'Please request and enter your verification OTP first.');
              return;
            }

            let digits = phoneVal.replace(/\D/g, '');
            if (digits.length === 10) {
              digits = '91' + digits;
            }
            const fullPhone = '+' + digits;

            const submitBtn = document.getElementById('loginSubmitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Verifying...';

            fetch('/api/auth/verify-phone-otp', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                phone: fullPhone,
                otp: otpVal
              })
            })
              .then(res => res.json())
              .then(data => {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Verify & Continue ❤️';

                if (data.error) {
                  showAlert('error', data.error);
                } else {
                  localStorage.setItem('token', data.token);
                  localStorage.setItem('userId', data.userId);
                  localStorage.setItem('username', data.username);
                  localStorage.setItem('credits', data.credits);
                  localStorage.setItem('paymentStatus', data.paymentStatus);

                  showAlert('success', 'Successfully authenticated! Redirecting...');

                  if (expiryTimers['login']) clearInterval(expiryTimers['login']);
                  if (cooldownTimers['login']) clearInterval(cooldownTimers['login']);

                  setTimeout(() => {
                    window.location.href = '/';
                  }, 1500);
                }
              })
              .catch(err => {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Verify & Continue ❤️';
                showAlert('error', 'Authentication failed. Please try again.');
              });
          }

          // Signup submit
          window.handleSignup = function (event) {
            event.preventDefault();
            clearAlerts();

            const fullName = document.getElementById('signupName').value.trim();
            const username = document.getElementById('signupUsername').value.trim();
            const phoneVal = document.getElementById('signupPhone').value.trim();
            const otpVal = document.getElementById('signupOtp').value.trim();
            const otpGroup = document.getElementById('signupOtpGroup');
            const referralCode = document.getElementById('referral-code-input').value.trim() || localStorage.getItem('refCode') || null;

            if (otpGroup.style.display === 'none' || !otpVal) {
              showAlert('error', 'Please request and enter your verification OTP first.');
              return;
            }

            let digits = phoneVal.replace(/\D/g, '');
            if (digits.length === 10) {
              digits = '91' + digits;
            }
            const fullPhone = '+' + digits;

            const submitBtn = document.getElementById('signupSubmitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';

            fetch('/api/auth/verify-phone-otp', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                fullName,
                username,
                phone: fullPhone,
                otp: otpVal,
                referralCode
              })
            })
              .then(res => res.json())
              .then(data => {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Verify & Continue ❤️';

                if (data.error) {
                  showAlert('error', data.error);
                } else {
                  localStorage.setItem('token', data.token);
                  localStorage.setItem('userId', data.userId);
                  localStorage.setItem('username', data.username);
                  localStorage.setItem('credits', data.credits);
                  localStorage.setItem('paymentStatus', data.paymentStatus);

                  showAlert('success', 'Account successfully created! Redirecting...');

                  if (expiryTimers['signup']) clearInterval(expiryTimers['signup']);
                  if (cooldownTimers['signup']) clearInterval(cooldownTimers['signup']);

                  setTimeout(() => {
                    window.location.href = '/';
                  }, 1500);
                }
              })
              .catch(err => {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Verify & Continue ❤️';
                showAlert('error', 'Registration failed. Please try again.');
              });
          }
        </script>
</body>

</html>
